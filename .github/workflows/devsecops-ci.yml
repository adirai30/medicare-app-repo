name: MediCare DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 0

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/medicare-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/medicare-frontend:${{ github.sha }} \
            ./frontend

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/medicare-backend:${{ github.sha }}

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/medicare-frontend:${{ github.sha }}
name: MediCare DevSecOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 0

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/medicare-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/medicare-frontend:${{ github.sha }} \
            ./frontend

      - name: Push backend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/medicare-backend:${{ github.sha }}

      - name: Push frontend Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/medicare-frontend:${{ github.sha }}

  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: adirai30/medicare-gitops-repo
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops-repo

      - name: Update backend image tag
        working-directory: gitops-repo
        run: |
          sed -i "s#medicare-backend:[^[:space:]]*#medicare-backend:${{ github.sha }}#" environments/development/backend-deploy.yaml

      - name: Update frontend image tag
        working-directory: gitops-repo
        run: |
          sed -i "s#medicare-frontend:[^[:space:]]*#medicare-frontend:${{ github.sha }}#" environments/development/frontend-deploy.yaml

      - name: Verify GitOps image tags
        working-directory: gitops-repo
        run: |
          echo "Backend image:"
          grep "image:" environments/development/backend-deploy.yaml

          echo "Frontend image:"
          grep "image:" environments/development/frontend-deploy.yaml

      - name: Commit and push GitOps changes
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/development/backend-deploy.yaml
          git add environments/development/frontend-deploy.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "gitops: update MediCare images to ${{ github.sha }}"
          git push origin main
